# Expõe a API da HUD (Jarvis) em jarvis.barberagendaonline.store.
#
# O docker-compose publica a porta só em 127.0.0.1, então é este nginx que coloca
# o serviço na internet, com HTTPS. A API do AgendaBarber segue no server block dela,
# em api.barberagendaonline.com — domínio diferente (.com), mesmo nginx e mesmo IP.
# O Jarvis mora no .store de propósito: um domínio por projeto, certificados separados.
#
# Instalar:
#   sudo cp nginx-jarvis.conf /etc/nginx/sites-available/jarvis
#   sudo ln -s /etc/nginx/sites-available/jarvis /etc/nginx/sites-enabled/jarvis
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jarvis.barberagendaonline.store
#
# O certbot reescreve este arquivo sozinho: ele adiciona o server block de 443 com o
# certificado e troca este aqui por um redirect 80 -> 443. Por isso o arquivo nasce
# só com a porta 80 — um bloco 443 apontando para um certificado que ainda não existe
# faz o `nginx -t` falhar, e aí o nginx não recarrega nem para o AgendaBarber.

server {
    listen 80;
    listen [::]:80;
    server_name jarvis.barberagendaonline.store;

    # Nada além de /api/ mora aqui: a tela da HUD é servida pela Vercel.
    location /api/ {
        # EventSource e anexos aceitam token na query. Não registrar URLs com credenciais.
        access_log off;
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # As três diretivas abaixo atendem /api/eventos e o alias /api/briefing/eventos.
        # Sem elas a HUD até conecta, mas nunca recebe um evento — ou perde a conexão
        # a cada 60 s, que é o proxy_read_timeout padrão.
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # conexão persistente com o upstream
        proxy_buffering off;              # cada evento sai na hora, sem acumular no buffer
        proxy_read_timeout 1h;            # o stream fica aberto o dia inteiro

        # O keep-alive do SSE vai a cada 25 s; isto é só uma folga por cima disso.
        proxy_send_timeout 1h;
    }

    # Qualquer outro caminho não pertence ao Jarvis.
    location / {
        return 404;
    }
}
