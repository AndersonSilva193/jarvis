services:
  jarvis:
    build: .
    container_name: jarvis
    env_file: .env
    restart: unless-stopped
    # A API da HUD escuta só no loopback do host: quem expõe com HTTPS é o nginx.
    # A mesma variável nos dois lados para a porta não sair de sincronia com o .env.
    ports:
      - "127.0.0.1:${JARVIS_PORTA:-8090}:${JARVIS_PORTA:-8090}"
    # A personalidade entra por volume, e não dentro da imagem: dá para editar o texto na VPS e o
    # Jarvis relê sozinho, sem rebuild. Somente leitura, porque o container nunca precisa escrever.
    volumes:
      - ./config:/app/config:ro
      # Os MP3s já sintetizados. Volume nomeado para a cota não ser gasta de novo com as
      # mesmas frases toda vez que o container reinicia.
      - voz:/data/voz
      - google:/data/google
      - memoria:/data/jarvis/memoria
      - memoria-exclusoes:/data/jarvis/memoria-exclusoes
      # A agenda do dono: lembretes gravados em JSON, reagendados na partida.
      - lembretes:/data/jarvis/lembretes
      # O histórico da conversa: um JSON por chat, para o Jarvis não perder o assunto no restart.
      - historico:/data/jarvis/historico
      # O diário de custo: um JSON por dia, 90 dias. Sem ele não há conta do mês.
      - custo:/data/jarvis/custo
      # O diário de ações: o que o Jarvis fez sozinho e o que foi aprovado, 30 dias.
      # Sem ele o dono perde o rastro da autonomia a cada restart.
      - diario:/data/jarvis/diario
      - pc-operacoes:/data/pc
    # Limite de memória para não disputar recursos com os outros sistemas da VPS
    # (512m depois da entrada do Tomcat; o uso medido fica bem abaixo disso)
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  voz:
  google:
  memoria:
  memoria-exclusoes:
  lembretes:
  historico:
  custo:
  diario:
  pc-operacoes:
