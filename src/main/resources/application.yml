spring:
  application:
    name: jarvis

server:
  # Porta da API da HUD. Dentro do container escutamos em 0.0.0.0 de propósito: quem restringe
  # o acesso é o docker-compose, que publica a porta só em 127.0.0.1 para o nginx.
  port: ${JARVIS_PORTA:8090}

jarvis:
  nome-usuario: ${NOME_USUARIO:chefe}
  fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  # Formato: nome=https://url,outro=https://url2
  sites: ${SITES_MONITORADOS:}
  telegram:
    token: ${TELEGRAM_TOKEN}
    # Deixe 0 na primeira vez: o bot mostra nos logs o ID de quem mandar mensagem.
    usuario-permitido: ${TELEGRAM_USUARIO_PERMITIDO:0}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    modelo: ${ANTHROPIC_MODELO:claude-haiku-5-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    # Menor prefixo cacheável do modelo. Precisa acompanhar ANTHROPIC_MODELO: 512 no Haiku 5.5
    # e no Sonnet 5.5, 4096 no Haiku 4.5. Abaixo disso a API ignora o cache_control calado.
    cache-minimo-tokens: ${ANTHROPIC_CACHE_MINIMO_TOKENS:512}
  busca-web:
    # Busca na web pela ferramenta server-side do Claude: quem executa é o servidor da Anthropic.
    ativa: ${BUSCA_WEB_ATIVA:true}
    # Versão do tipo da ferramenta. A básica roda em qualquer modelo atual; as de 2026 fazem
    # filtragem dinâmica, que roda a busca dentro do code execution e pede um modelo com
    # programmatic tool calling. Confira o capabilities do modelo no Models API antes de trocar.
    tipo: ${BUSCA_WEB_TIPO:web_search_20250305}
    # Teto de buscas por pedido. Cada busca é cobrada à parte dos tokens.
    max-usos: ${BUSCA_WEB_MAX_USOS:3}
  clima:
    cidade: ${CLIMA_CIDADE:Curitiba}
    # Coordenadas da cidade (o "-" antes do número é o valor default, não um erro de sintaxe)
    latitude: ${CLIMA_LATITUDE:-25.4284}
    longitude: ${CLIMA_LONGITUDE:-49.2733}
  noticias:
    # Formato: tema|url,tema|url  (o mesmo tema pode repetir, com vários feeds)
    feeds: ${NOTICIAS_FEEDS:}
  hud:
    # Token obrigatório em todos os endpoints (menos /api/saude). Vazio = ninguém entra.
    token: ${HUD_TOKEN:}
    # Origens liberadas no CORS, separadas por vírgula. Vazio = nenhuma origem de navegador.
    origens: ${HUD_ORIGEM:}
  voz:
    # elevenlabs = a voz do Jarvis sai da ElevenLabs; navegador = a HUD usa a voz do sistema.
    provedor: ${VOZ_PROVEDOR:navegador}
    # Chave da ElevenLabs. Vazia com provedor=elevenlabs cai para o navegador, sem derrubar nada.
    api-key: ${VOZ_API_KEY:}
    # ID da voz escolhida no painel da ElevenLabs (Voices -> ID).
    voz-id: ${VOZ_ID:}
    # Flash v2.5: ~75ms, fala português e custa metade por caractere. Turbo v2.5 está deprecado.
    modelo: ${VOZ_MODELO:eleven_flash_v2_5}
    # Por cento da cota que o Jarvis se recusa a gastar. Chegando aí, volta à voz do navegador.
    reserva-pct: ${VOZ_RESERVA_PCT:5}
  youtube:
    # Chave da YouTube Data API v3. Vazia desliga a ferramenta tocar_youtube.
    api-key: ${YOUTUBE_API_KEY:}
  personalidade:
    # Markdown com o jeito do Jarvis. É relido sozinho quando o arquivo muda, sem rebuild.
    arquivo: ${JARVIS_PERSONALIDADE_ARQUIVO:/app/config/personalidade.md}
  resumo-diario:
    # segundo minuto hora dia mês dia-da-semana  ("-" desliga)
    cron: ${RESUMO_DIARIO_CRON:0 0 8 * * MON-FRI}

logging:
  level:
    root: INFO
