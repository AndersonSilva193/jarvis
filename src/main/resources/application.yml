spring:
  application:
    name: jarvis

server:
  # Porta da API da HUD. Dentro do container escutamos em 0.0.0.0 de propósito: quem restringe
  # o acesso é o docker-compose, que publica a porta só em 127.0.0.1 para o nginx.
  port: ${JARVIS_PORTA:8090}

jarvis:
  nome-usuario: ${NOME_USUARIO:chefe}
  fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  # Formato: nome=https://url,outro=https://url2
  sites: ${SITES_MONITORADOS:}
  telegram:
    token: ${TELEGRAM_TOKEN}
    # Deixe 0 na primeira vez: o bot mostra nos logs o ID de quem mandar mensagem.
    usuario-permitido: ${TELEGRAM_USUARIO_PERMITIDO:0}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    modelo: ${ANTHROPIC_MODELO:claude-haiku-5-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    # Menor prefixo cacheável do modelo. Precisa acompanhar ANTHROPIC_MODELO: 512 no Haiku 5.5
    # e no Sonnet 5.5, 4096 no Haiku 4.5. Abaixo disso a API ignora o cache_control calado.
    cache-minimo-tokens: ${ANTHROPIC_CACHE_MINIMO_TOKENS:512}
  busca-web:
    # Busca na web pela ferramenta server-side do Claude: quem executa é o servidor da Anthropic.
    ativa: ${BUSCA_WEB_ATIVA:true}
    # Versão do tipo da ferramenta. A básica roda em qualquer modelo atual; as de 2026 fazem
    # filtragem dinâmica, que roda a busca dentro do code execution e pede um modelo com
    # programmatic tool calling. Confira o capabilities do modelo no Models API antes de trocar.
    tipo: ${BUSCA_WEB_TIPO:web_search_20250305}
    # Teto de buscas por pedido. Cada busca é cobrada à parte dos tokens.
    max-usos: ${BUSCA_WEB_MAX_USOS:3}
  clima:
    cidade: ${CLIMA_CIDADE:Curitiba}
    # Coordenadas da cidade (o "-" antes do número é o valor default, não um erro de sintaxe)
    latitude: ${CLIMA_LATITUDE:-25.4284}
    longitude: ${CLIMA_LONGITUDE:-49.2733}
  noticias:
    # Formato: tema|url,tema|url  (o mesmo tema pode repetir, com vários feeds)
    feeds: ${NOTICIAS_FEEDS:}
  hud:
    # Token obrigatório em todos os endpoints (menos /api/saude). Vazio = ninguém entra.
    token: ${HUD_TOKEN:}
    # Origens liberadas no CORS, separadas por vírgula. Vazio = nenhuma origem de navegador.
    origens: ${HUD_ORIGEM:}
  voz:
    # elevenlabs = a voz do Jarvis sai da ElevenLabs; navegador = a HUD usa a voz do sistema.
    provedor: ${VOZ_PROVEDOR:navegador}
    # Chave da ElevenLabs. Vazia com provedor=elevenlabs cai para o navegador, sem derrubar nada.
    api-key: ${VOZ_API_KEY:}
    # ID da voz escolhida no painel da ElevenLabs (Voices -> ID).
    voz-id: ${VOZ_ID:}
    # Flash v2.5: ~75ms, fala português e custa metade por caractere. Turbo v2.5 está deprecado.
    modelo: ${VOZ_MODELO:eleven_flash_v2_5}
    # Por cento da cota que o Jarvis se recusa a gastar. Chegando aí, volta à voz do navegador.
    reserva-pct: ${VOZ_RESERVA_PCT:5}
    # Uso da cota que dispara o aviso antecipado, uma vez por período de cobrança. 0 desliga.
    aviso-percentual: ${VOZ_AVISO_PERCENTUAL:80}
  youtube:
    # Chave da YouTube Data API v3. Vazia desliga a ferramenta tocar_youtube.
    api-key: ${YOUTUBE_API_KEY:}
  pc:
    operacoes-pasta: ${PC_OPERACOES_PASTA:/data/pc/operacoes.json}
    edicao-max-bytes: ${PC_EDICAO_MAX_BYTES:1048576}
    edicao-max-operacoes: ${PC_EDICAO_MAX_OPERACOES:10}
    edicao-max-bytes-resultado: ${PC_EDICAO_MAX_BYTES_RESULTADO:1048576}
    # Token do agente que roda no PC Windows. Separado do HUD_TOKEN de propósito: a HUD não manda
    # na máquina. Vazio = /api/pc recusa tudo com 401 e o controle do PC fica desligado.
    token: ${PC_TOKEN:}
  computer-use:
    ativo: ${COMPUTER_USE_ATIVO:false}
    provedor: ${COMPUTER_USE_PROVEDOR:anthropic}
    modelo-anthropic: ${COMPUTER_USE_MODELO_ANTHROPIC:claude-haiku-5-5}
    modelo-openai: ${COMPUTER_USE_MODELO_OPENAI:gpt-6.1-sol}
    openai-api-key: ${OPENAI_API_KEY:}
    max-ciclos: ${COMPUTER_USE_MAX_CICLOS:35}
    max-acoes: ${COMPUTER_USE_MAX_ACOES:75}
    duracao-segundos: ${COMPUTER_USE_DURACAO_SEGUNDOS:300}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    chave-cofre: ${GOOGLE_CHAVE_COFRE:}
    pasta-credenciais: ${GOOGLE_PASTA_CREDENCIAIS:/data/google}
  personalidade:
    # Markdown com o jeito do Jarvis. É relido sozinho quando o arquivo muda, sem rebuild.
    arquivo: ${JARVIS_PERSONALIDADE_ARQUIVO:/app/config/personalidade.md}
  memoria:
    pasta: ${MEMORIA_PASTA:/data/jarvis/memoria}
    pasta-exclusoes: ${MEMORIA_PASTA_EXCLUSOES:/data/jarvis/memoria-exclusoes}
    # O Jarvis anota sozinho o que o dono conta, sem ele pedir. Falso deixa só as ferramentas.
    anotador-ativo: ${MEMORIA_ANOTADOR_ATIVO:true}
    # Minutos sem turno novo que fecham o trecho e chamam o anotador (o outro gatilho é 10 turnos).
    anotador-ocioso-minutos: ${MEMORIA_ANOTADOR_OCIOSO_MINUTOS:5}
  lembretes:
    arquivo: ${LEMBRETES_ARQUIVO:/data/jarvis/lembretes/lembretes.json}
  historico:
    pasta: ${HISTORICO_PASTA:/data/jarvis/historico}
    # Três dias: com 24 h a conversa de sexta-feira não existia mais na segunda.
    validade-horas: ${HISTORICO_VALIDADE_HORAS:72}
    # Quantos turnos do fim ficam inteiros, com os resultados de ferramenta. 0 compacta todos.
    turnos-completos: ${HISTORICO_TURNOS_COMPLETOS:1}
    # Teto da resposta guardada no turno compacto; o que passa disso sai com "[…]".
    max-caracteres-resposta: ${HISTORICO_MAX_CARACTERES_RESPOSTA:1500}
  custo:
    # Um JSON por dia com o gasto, 90 dias guardados. Volume nomeado "custo".
    pasta: ${CUSTO_PASTA:/data/jarvis/custo}
    # "modelo=entrada/saida/cache_escrita/cache_leitura;outro=...", dólares por MILHÃO de tokens.
    # Vazio: o Jarvis conta os tokens e avisa uma vez por dia que não sabe convertê-los em dólar.
    precos: ${CUSTO_PRECOS:}
    # "modelo@limiar=entrada/saida/cache_escrita/cache_leitura"; aplica-se à chamada inteira
    # quando entrada + cache escrito + cache lido passa do limiar.
    precos-contexto-longo: ${CUSTO_PRECOS_CONTEXTO_LONGO:}
    # Dólares por MIL buscas — denominador diferente do de cima, porque é assim que é publicado.
    preco-busca-web: ${CUSTO_PRECO_BUSCA_WEB:}
    # Gasto do dia que dispara aviso em 80% e em 100%. Vazio = sem teto. O teto avisa, não bloqueia.
    teto-diario-usd: ${CUSTO_TETO_DIARIO_USD:}
  diario:
    # Um JSON por dia com o que o Jarvis fez sozinho e o que fez depois de um "sim",
    # 30 dias guardados. Volume nomeado "diario".
    pasta: ${DIARIO_PASTA:/data/jarvis/diario}
  proativo:
    # Faixa em que o Jarvis não fala sem ser chamado. Cruza a meia-noite; o que acontecer dentro
    # dela é entregue junto, numa mensagem, no fim. Mesma hora nos dois lados = sem silêncio.
    # Entre aspas porque sem elas o YAML leria os ":" do default como mapa.
    silencio: "${PROATIVO_SILENCIO:23:00-07:00}"
    # Histórico de disponibilidade por site: um JSON por dia, 30 dias. Volume nomeado "proativo".
    pasta: ${PROATIVO_PASTA:/data/jarvis/proativo}
    # Minutos entre duas checagens dos SITES_MONITORADOS. Um site só é dado como fora depois de
    # duas checagens seguidas com falha, então o aviso chega em até o dobro disso.
    sites-intervalo-minutos: ${SITES_INTERVALO_MINUTOS:5}
    # Formato: nome_do_site=nome_da_rotina  (a rotina tem de existir no agente do PC)
    sites-acoes: ${SITES_ACOES:}
  resumo-diario:
    # segundo minuto hora dia mês dia-da-semana  ("-" desliga)
    cron: ${RESUMO_DIARIO_CRON:0 0 8 * * MON-FRI}

logging:
  level:
    root: INFO
